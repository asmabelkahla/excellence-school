# Render Blueprint — 100 % free deployment (Render free plan + Neon free PostgreSQL).
# Render dashboard → New → Blueprint → choose this repository. See DEPLOYMENT.md.
services:
  # ---------------------------------------------------------------- API (NestJS)
  - type: web
    name: excellence-api
    runtime: node
    plan: free            # sleeps after 15 min without traffic, wakes up in ~1 min
    region: frankfurt     # closest Render region to Tunisia
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false       # Neon connection string (postgresql://...?sslmode=require)
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_HOST  # allows the front-end origin through CORS
        fromService:
          type: web
          name: excellence-web
          property: host
      - key: CORS_ORIGINS   # optional extra origins (e.g. a custom domain), comma-separated
        sync: false
      - key: ADMIN_EMAIL    # first admin, created only if no admin exists
        sync: false
      - key: ADMIN_PASSWORD # one-time: must be changed at first sign-in
        sync: false
      - key: VAPID_PUBLIC_KEY   # push notifications: npx web-push generate-vapid-keys
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contact@excellence-school.tn

  # ------------------------------------------------- Front-end (Angular PWA, static)
  - type: web
    name: excellence-web
    runtime: static
    buildCommand: npm ci && node scripts/set-api-url.mjs && npx ng build --configuration production
    staticPublishPath: dist/excellence-school/browser
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_HOST
        fromService:
          type: web
          name: excellence-api
          property: host
    routes:
      # Single-page app: every unknown path serves index.html (existing files are served as is).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The service worker and its manifest must never be cached, or updates would not reach phones.
      - path: /ngsw-worker.js
        name: Cache-Control
        value: no-cache
      - path: /ngsw.json
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
