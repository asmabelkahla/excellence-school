# CI: every push and pull request is built and tested.
# CD: Render deploys main only once these checks pass (autoDeployTrigger: checksPass in render.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Application (tests + build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Tests unitaires
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build de production
        run: npx ng build --configuration production

  api:
    name: API (build + tests de bout en bout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excellence_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Base de test (schéma + données de démonstration)
        run: |
          psql -h localhost -U postgres -d excellence_db -v ON_ERROR_STOP=1 -q -f ../database/schema.sql
          psql -h localhost -U postgres -d excellence_db -v ON_ERROR_STOP=1 -q -f ../database/seed-demo.sql
      - name: Démarrage de l'API
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: excellence_db
          JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef
          JWT_EXPIRES_IN: 1h
          PORT: '3000'
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Tests de bout en bout (inscriptions parents)
        run: node test/e2e/registrations.e2e.mjs
        env:
          API_URL: http://localhost:3000/api
      - name: Journal de l'API en cas d'échec
        if: failure()
        run: cat api.log || true
