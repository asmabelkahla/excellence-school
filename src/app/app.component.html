<!-- If Auth Page (Login / Register), show clean standalone view -->
@if (isAuthPage()) {
  <div class="auth-wrapper">
    <router-outlet></router-outlet>
  </div>
} @else {
  <!-- Main App Layout with Navbar, Sidebar, and Page Body -->
  <div class="app-layout">
    <app-navbar></app-navbar>

    <div class="app-body-container">
      <app-sidebar class="desktop-sidebar"></app-sidebar>

      <main class="main-content" id="main">
        <div class="page-body">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>

    <!-- Phones: bottom tabs + full menu in a drawer -->
    <app-bottom-nav [menuOpen]="menuOpen()" (menuToggled)="menuOpen.set(!menuOpen())" (menuClosed)="menuOpen.set(false)"></app-bottom-nav>
    @if (menuOpen()) {
      <div class="mobile-menu-backdrop" (click)="menuOpen.set(false)"></div>
      <div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu" (click)="onMenuClick($event)">
        <div class="mobile-menu-handle" aria-hidden="true"></div>
        <app-sidebar></app-sidebar>
      </div>
    }
  </div>
}
<app-pwa-banners></app-pwa-banners>
